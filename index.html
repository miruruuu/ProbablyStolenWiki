<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <title>Probably Stolen Wiki</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root {
      --sidebar-width: 240px; /* 側邊欄寬度 */
    }

    /* 1. 主要內容區域：不被側邊欄擠壓，自動展開居中 */
    .content {
      left: 0 !important;
      padding-left: 60px !important; /* 預留左側空間給收合切換按鈕 */
    }

    /* 2. 側邊欄：毛玻璃半透明懸浮抽屜，帶平滑過渡動畫 */
    .sidebar {
      width: var(--sidebar-width) !important;
      position: fixed !important;
      top: 0;
      left: 0;
      bottom: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.75) !important;
      backdrop-filter: blur(10px) !important;
      -webkit-backdrop-filter: blur(10px) !important;
      box-shadow: 4px 0 20px rgba(0, 0, 0, 0.08) !important;
      border-right: 1px solid rgba(0, 0, 0, 0.06) !important;
      transition: transform 0.25s ease-out !important;
    }

    /* 3. 預設收合狀態：平移至螢幕外 */
    .close .sidebar {
      transform: translateX(calc(-1 * var(--sidebar-width))) !important;
    }

    /* 4. 左下角收合按鈕：確保在頂層且易於點擊 */
    .sidebar-toggle {
      z-index: 101 !important;
      background: rgba(255, 255, 255, 0.9) !important;
      border-radius: 4px;
      cursor: pointer;
    }

    /* 5. 搜尋欄樣式微調（適配半透明側邊欄） */
    .sidebar .search {
      margin-bottom: 10px;
    }
  </style>
</head>
<body class="close">
  <div id="app">載入中...</div>
  <script>
    window.$docsify = {
      name: 'Probably Stolen Wiki',
      repo: '',
      loadSidebar: true,
      subMaxLevel: 3,

      // 1. 底層回退語言設為英文
      fallbackLanguages: ['en-us'],

      // 2. 側邊欄別名映射：各自優先使用目錄下的 _sidebar.md，缺少時以 en-us 為準
      alias: {
        '/zh-tw/.*/_sidebar.md': '/zh-tw/_sidebar.md',
        '/en-us/.*/_sidebar.md': '/en-us/_sidebar.md',
        '/.*/_sidebar.md': '/en-us/_sidebar.md'
      },

      // 3. 全文搜尋提示文字（支援多語言路徑切換）
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: {
          '/zh-tw/': '搜尋數據、道具或機制...',
          '/': 'Search documentation...'
        },
        noData: {
          '/zh-tw/': '找不到相關結果',
          '/': 'No results found.'
        },
        depth: 3
      },

      // 4. 代碼複製按鈕
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Failed',
        successText: 'Copied'
      },

      // 5. 擴充外掛：自動跳轉至 en-us + GitHub 編輯連結
      plugins: [
        function(hook, vm) {
          hook.beforeEach(function(html) {
            // 偵測是否停留在中立根目錄，若是則直接跳轉至英文版
            var path = vm.route.path;
            if (path === '/' || path === '' || path === '/README') {
              window.location.replace('#/en-us/');
              return '';
            }

            // GitHub 頁面編輯連結
            var url = 'https://github.com/miruruuu/ProbablyStolenWiki/blob/main/' + vm.route.file;
            var isZh = path.indexOf('/zh-tw/') === 0;
            var editLabel = isZh ? '📝 編輯此頁面' : '📝 Edit this page';
            var editHtml = '[' + editLabel + '](' + url + ')\n\n';
            return editHtml + html;
          });
        }
      ]
    };
  </script>

  <!-- Docsify 核心腳本 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>

  <!-- 全文搜尋外掛 -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>

  <!-- 代碼框一鍵複製外掛 -->
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>

  <!-- Prism 語法高亮外掛（C# 語言） -->
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-csharp.min.js"></script>
</body>
</html>
